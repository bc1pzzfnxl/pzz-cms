name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Prepare local D1
        run: |
          bunx wrangler d1 migrations apply DB --local
          bunx wrangler d1 execute DB --local --file=./scripts/seed.sql

      # Boots the built Worker on the real workerd runtime and checks that
      # routes answer. This is the execution gate the local sandbox cannot
      # provide. See PLAN.md, "Environment note".
      - name: Runtime smoke test (workerd)
        run: |
          set -euo pipefail
          bunx wrangler dev --config dist/server/wrangler.json --port 8787 --ip 127.0.0.1 > /tmp/wrangler.log 2>&1 &
          SERVER_PID=$!

          fail() {
            echo "::error::$1"
            cat /tmp/wrangler.log
            kill "$SERVER_PID" 2>/dev/null || true
            exit 1
          }

          expect() {
            local path="$1" want="$2"
            local got
            got=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "http://127.0.0.1:8787$path" || true)
            echo "GET $path -> $got (want $want)"
            [ "$got" = "$want" ] || fail "Expected $want for $path, got $got"
          }

          ready=0
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1:8787/ || true)
            if [ "$code" = "200" ]; then ready=1; break; fi
            sleep 1
          done
          [ "$ready" = "1" ] || fail "Worker did not answer on / within 60s"

          expect "/" 200
          expect "/premier-article/" 200
          expect "/brouillon/" 404
          expect "/ancien-slug/" 301
          expect "/sitemap-index.xml" 200

          kill "$SERVER_PID" 2>/dev/null || true
          echo "Runtime smoke test passed."
