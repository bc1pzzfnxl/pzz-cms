name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      # Boots the built Worker on the real workerd runtime and checks that
      # routes answer. This is the execution gate the local sandbox cannot
      # provide. See PLAN.md, "Environment note".
      - name: Runtime smoke test (workerd)
        run: |
          set -euo pipefail
          bunx wrangler dev --config dist/server/wrangler.json --port 8787 --ip 127.0.0.1 > /tmp/wrangler.log 2>&1 &
          SERVER_PID=$!

          ready=0
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 http://127.0.0.1:8787/ || true)
            if [ "$code" = "200" ]; then ready=1; break; fi
            sleep 1
          done

          if [ "$ready" != "1" ]; then
            echo "::error::Worker did not answer on / within 60s"
            cat /tmp/wrangler.log
            kill "$SERVER_PID" 2>/dev/null || true
            exit 1
          fi
          echo "GET / -> 200"

          missing=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8787/does-not-exist/)
          echo "GET /does-not-exist/ -> $missing"
          if [ "$missing" != "404" ]; then
            echo "::error::Expected 404 for an unknown route"
            cat /tmp/wrangler.log
            kill "$SERVER_PID" 2>/dev/null || true
            exit 1
          fi

          sitemap=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8787/sitemap-index.xml)
          echo "GET /sitemap-index.xml -> $sitemap"
          if [ "$sitemap" != "200" ]; then
            echo "::error::Expected 200 for the sitemap"
            kill "$SERVER_PID" 2>/dev/null || true
            exit 1
          fi

          kill "$SERVER_PID" 2>/dev/null || true
          echo "Runtime smoke test passed."
